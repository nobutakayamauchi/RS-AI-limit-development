<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>WebAI Bridge</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f7f8; color: #111; min-height: 100dvh; }
    main { width: min(760px, 100%); min-height: 100dvh; margin: 0 auto; background: #fff; display: flex; flex-direction: column; }
    header { padding: 16px; border-bottom: 1px solid #ddd; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    #welcome { margin: 0 0 12px; font-size: 14px; color: #555; }
    .payer { display: grid; gap: 8px; padding-top: 4px; }
    .payer label { font-size: 12px; color: #666; }
    select, input[type=password] { width: 100%; min-height: 40px; border: 1px solid #bbb; border-radius: 10px; padding: 8px 10px; font: inherit; background: #fff; }
    #byok-note, #meter { font-size: 12px; color: #666; margin: 0; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 88%; padding: 11px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
    .user { align-self: flex-end; background: #111; color: #fff; }
    .assistant { align-self: flex-start; background: #eee; color: #111; }
    .system { align-self: center; background: transparent; color: #777; font-size: 13px; padding: 4px; }
    form { display: flex; gap: 8px; padding: 12px max(12px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); border-top: 1px solid #ddd; background: #fff; }
    textarea { flex: 1; resize: none; min-height: 44px; max-height: 140px; border: 1px solid #bbb; border-radius: 12px; padding: 11px; font: inherit; }
    button { min-width: 72px; border: 0; border-radius: 12px; padding: 0 14px; font: inherit; font-weight: 700; background: #111; color: #fff; }
    button:disabled, textarea:disabled { opacity: .55; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <header>
    <h1 id="title">WebAI Bridge</h1>
    <p id="welcome">読み込み中…</p>
    <div class="payer">
      <label for="payer">推論代の支払い元</label>
      <select id="payer"></select>
      <div id="byok-wrap">
        <label for="api-key">あなたのOpenAI APIキー（この画面では保存しません）</label>
        <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…">
        <p id="byok-note">BYOKでは推論代はあなたのAPIアカウント側に発生します。</p>
      </div>
      <p id="meter"></p>
    </div>
  </header>
  <section id="messages" aria-live="polite"></section>
  <form id="form">
    <textarea id="input" rows="1" placeholder="メッセージを入力" autocomplete="off"></textarea>
    <button id="send" type="submit">送信</button>
  </form>
</main>
<script>
(() => {
  const slug = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  const title = document.getElementById('title');
  const welcome = document.getElementById('welcome');
  const messages = document.getElementById('messages');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const payer = document.getElementById('payer');
  const byokWrap = document.getElementById('byok-wrap');
  const apiKey = document.getElementById('api-key');
  const meter = document.getElementById('meter');
  const history = [];
  let config = null;

  function add(role, text) {
    const el = document.createElement('div');
    el.className = `msg ${role}`;
    el.textContent = text;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
  }

  function updatePayerUi() {
    byokWrap.hidden = payer.value !== 'BYOK';
    meter.textContent = payer.value === 'PLATFORM_CREDIT'
      ? 'このAIに設定された運営側の上限予算から消費します。残高不足時は実行前に停止します。'
      : '';
  }

  async function loadConfig() {
    const res = await fetch(`/apps/${encodeURIComponent(slug)}/public-config`);
    if (!res.ok) throw new Error('設定を読み込めませんでした');
    config = await res.json();
    title.textContent = config.display_name;
    welcome.textContent = config.welcome;
    payer.innerHTML = '';
    for (const mode of config.allowed_payer_modes || []) {
      const option = document.createElement('option');
      option.value = mode;
      option.textContent = mode === 'BYOK' ? '自分のAPIキー（BYOK）' : '運営提供クレジット';
      payer.appendChild(option);
    }
    payer.value = config.default_payer_mode;
    updatePayerUi();
  }

  async function submitMessage(text) {
    const payerMode = payer.value;
    const key = apiKey.value.trim();
    if (payerMode === 'BYOK' && !key) {
      add('system', 'BYOKを使う場合はAPIキーを入力してください。');
      return;
    }

    const prior = history.slice();
    add('user', text);
    input.value = '';
    input.disabled = true;
    send.disabled = true;
    try {
      const headers = {'Content-Type': 'application/json'};
      if (payerMode === 'BYOK') headers['X-Provider-API-Key'] = key;
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers,
        body: JSON.stringify({slug, message: text, history: prior, payer_mode: payerMode})
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || 'AIへの接続に失敗しました');
      add('assistant', data.text);
      history.push({role: 'user', content: text});
      history.push({role: 'assistant', content: data.text});
      if (data.meter) {
        const m = data.meter;
        const cost = Number.isInteger(m.charged_cost_usd_micros)
          ? ` / platform debit $${(m.charged_cost_usd_micros / 1000000).toFixed(6)}`
          : '';
        meter.textContent = `${m.payer_mode} / ${m.model}${cost}`;
      }
    } catch (err) {
      add('system', err.message || 'エラーが発生しました');
    } finally {
      input.disabled = false;
      send.disabled = false;
      input.focus();
    }
  }

  payer.addEventListener('change', updatePayerUi);
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (text) submitMessage(text);
  });

  loadConfig().catch(err => add('system', err.message));
})();
</script>
</body>
</html>
